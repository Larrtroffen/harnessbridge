name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli-and-docs:
    name: CLI checks (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          python3 --version
          uname -a

      - name: Python backend — compile
        run: |
          python3 -m compileall -q tools/agent-session-import
          echo "backend compiles"

      - name: CLI — smoke
        run: |
          python3 tools/agent-session-import/asi --version
          python3 tools/agent-session-import/asi --help > /dev/null
          python3 tools/agent-session-import/asi detect --json > /tmp/detect.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/detect.json'))
          assert d['ok'] is True
          print('harnesses detected:', d['totals']['harnesses_detected'])
          print('sessions total:', d['totals']['total_sessions'])
          PY

      - name: Docs — required files and links
        run: |
          set -euo pipefail
          for f in README.md README.zh-CN.md LICENSE CHANGELOG.md \
                   docs/ARCHITECTURE.md docs/ARCHITECTURE.zh-CN.md \
                   docs/CLI.md docs/CLI.zh-CN.md docs/COMPATIBILITY.md \
                   docs/COMPATIBILITY.zh-CN.md docs/FAQ.md docs/FAQ.zh-CN.md \
                   tools/HarnessBridgeApp/Package.swift; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          echo "required docs present"

      - name: Workflows — YAML sanity
        run: |
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              sys.exit(0)
          for f in ['.github/workflows/ci.yml', '.github/workflows/release.yml']:
              yaml.safe_load(open(f))
              print('yaml ok:', f)
          PY
