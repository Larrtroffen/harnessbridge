name: Feature request
description: Suggest a new harness adapter, workflow, or documentation improvement
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to do that is currently hard or impossible?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New harness reader
        - New harness writer / direct install
        - Migration UX (app)
        - CLI flags / automation
        - ATIF / IR conversion fidelity
        - Documentation / translations
        - Other
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior/API/docs you would like. If it is a harness, include where it stores sessions and any public format docs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, redacted fixtures, links. Do not include real session contents or credentials.
    validations:
      required: false
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I am willing to help test or implement this.
          required: false
