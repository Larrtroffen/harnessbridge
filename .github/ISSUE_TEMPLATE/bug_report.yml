name: Bug report
description: Report a reproducible problem with HarnessBridge (app or CLI)
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Do not paste real session contents, API keys, or absolute personal paths.** Redact IDs and paths (use `~/...`).
        Security issues: please follow [SECURITY.md](../SECURITY.md) instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, in one or two sentences?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - macOS app (HarnessBridge.app)
        - CLI (`asi`)
        - Migration/install/move/restore behavior
        - Reader/writer for a specific harness
        - Documentation
        - Build / release / packaging
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HarnessBridge / asi version
      placeholder: "e.g. HarnessBridge 1.5.0 (build 1) or asi 0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and CPU
      placeholder: "e.g. macOS 14.6, Apple Silicon (arm64); or Ubuntu 24.04 for CLI-only"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands or UI steps. Redact paths.
      placeholder: |
        1. asi detect --json
        2. asi migrate --from claude --session <redacted-id> --to dsh --dry-run --json
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior (logs / JSON excerpts, redacted)
      render: shell
    validations:
      required: true
  - type: dropdown
    id: real_store
    attributes:
      label: Did this involve writing to a real harness store?
      options:
        - "No (dry-run / export only)"
        - "Yes — a real store was modified"
        - "Not sure"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have removed credentials, personal paths and real session content from this report.
          required: true
